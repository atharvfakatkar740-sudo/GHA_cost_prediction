name: Publish Docker Images & Release

# ─────────────────────────────────────────────────────────────────────────────
# Builds and publishes the full modular stack (database + backend + frontend)
# to the GitHub Container Registry (ghcr.io) and cuts an auto-incremented
# GitHub Release.
#
# Trigger: ONLY when a pull request from ANY branch is MERGED into `main`.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [closed]
    branches: [main]

# Avoid overlapping release runs
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write      # create tags + releases
  packages: write      # push images to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: gha-cost-predictor

jobs:
  # ── Gate: build the whole stack & smoke-test before anything is published ───
  verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push) & smoke-test the stack
        run: |
          echo "Building full stack locally for verification..."
          docker compose build
          echo "Starting stack..."
          docker compose up -d
          echo "Waiting for backend health..."
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              ok=true; break
            fi
            sleep 5
          done
          docker compose ps
          if [ "$ok" != "true" ]; then
            echo "::error::Backend did not become healthy — aborting publish."
            docker compose logs --tail=100
            docker compose down -v
            exit 1
          fi
          echo "Smoke test passed."
          docker compose down -v

  publish:
    # Publish ONLY after the verify gate succeeds
    needs: verify
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # ── Checkout full history so we can read existing tags ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Compute the next semantic version (patch bump) ──────────────────────
      - name: Determine next version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          patch=$((patch + 1))
          next="v${major}.${minor}.${patch}"
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

      # ── Lowercase owner (ghcr requires lowercase namespaces) ────────────────
      - name: Compute registry namespace
        id: ns
        run: |
          owner="${{ github.repository_owner }}"
          echo "owner_lc=${owner,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Database image ──────────────────────────────────────────────────────
      - name: Build & push database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-database:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-database:latest
          cache-from: type=gha,scope=database
          cache-to: type=gha,scope=database,mode=max

      # ── Backend image ───────────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Frontend image ──────────────────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=http://localhost:8000
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ── Tag the repo + publish a GitHub Release ─────────────────────────────
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          body: |
            ## GHA Cost Predictor — ${{ steps.version.outputs.version }}

            Merged PR **#${{ github.event.pull_request.number }}**: ${{ github.event.pull_request.title }}

            ### Published container images (ghcr.io)
            | Component | Image |
            |-----------|-------|
            | Database  | `${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-database:${{ steps.version.outputs.version }}` |
            | Backend   | `${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.version }}` |
            | Frontend  | `${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}` |

            ### Run the full stack
            ```bash
            export IMAGE_TAG=${{ steps.version.outputs.version }}
            export IMAGE_OWNER=${{ steps.ns.outputs.owner_lc }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
